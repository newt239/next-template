name: Playwright Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    env:
      TURSO_CONNECTION_URL: file:ci.db
      TURSO_AUTH_TOKEN: ci
      BETTER_AUTH_SECRET: ci-dummy-secret-not-used-in-production
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "package.json"
          cache: "pnpm"
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: Playwrightのバージョンを取得し、ブラウザのキャッシュキーを生成
        id: version-checker
        run: |
          echo "playwright-version=$(pnpm exec playwright --version | sed 's/ //g')" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: ブラウザのキャッシュを復元
        id: restore-chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.version-checker.outputs.playwright-version }}
          restore-keys: |
            playwright-chromium-
      - name: もしブラウザのキャッシュがなければインストール
        run: pnpm exec playwright install --with-deps chromium
        if: ${{ steps.restore-chromium.outputs.cache-hit != 'true' }}
      - name: ブラウザのキャッシュを保存
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.restore-chromium.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.version-checker.outputs.playwright-version }}
      - name: ビルドキャッシュを復元
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: DBマイグレーションを適用
        run: pnpm run db:migrate
      - name: ビルド
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Playwrightのテストを実行
        run: pnpm exec playwright test --workers=2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: html-report/
          retention-days: 30
